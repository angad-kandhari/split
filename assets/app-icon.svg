      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1E1B3A" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#FFFFFF" filter="url(#shadow)"/>
  <rect x="100.75" y="100.75" width="822.5" height="822.5" rx="184.25" fill="none" stroke="#D5D3EE" stroke-width="1.5"/>
  <rect x="232" y="232" width="265" height="560" rx="81" fill="#5B5BD6"/>
  <rect x="541" y="232" width="251" height="258" rx="81" fill="#1F9E8F"/>
